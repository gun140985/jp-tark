name: 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            # 오류 줄만 골라 요약(annotation)으로 남김
            { grep -E "^e: " build.log | head -15; grep -A 25 "What went wrong" build.log | head -30; } > errs.txt || true
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errs.txt)
            echo "::error title=build::${msg}"
            exit 1
          fi

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk jp-talk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jp-talk
          path: jp-talk.apk

      - name: 최신 버전으로 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jp-talk.apk \
            --title "한일 통역 최신 버전" \
            --notes "휴대폰에서 아래 jp-talk.apk 를 눌러 내려받아 설치하세요." \
            --target "${{ github.sha }}"
